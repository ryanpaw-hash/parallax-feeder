name: feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node feeder.mjs
        env:
          FEED_SECRET: ${{ secrets.FEED_SECRET }}
          PARALLAX_URL: https://parallax.pawww.sbs
